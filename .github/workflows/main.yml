name: Build Fabric Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./endless-polar-express-26.2-fabric

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build mod with Gradle
        run: gradle build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: endless-polar-express-mod
          path: endless-polar-express-26.2-fabric/build/libs/*.jar
